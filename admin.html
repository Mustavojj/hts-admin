<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GRAM HUNTERS - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --bg: #0A0A0F;
            --bg-2: #101018;
            --surface: #14141F;
            --surface-2: #1B1B28;
            --primary: #F5B301;
            --primary-2: #FF8A00;
            --primary-soft: #FFD966;
            --text: #FFFFFF;
            --text-secondary: #9CA3AF;
            --text-muted: #6B7280;
            --success: #22C55E;
            --error: #EF4444;
            --warning: #F59E0B;
            --info: #3B82F6;
            --border: rgba(245, 179, 1, 0.12);
            --border-soft: rgba(255, 255, 255, 0.06);
            --radius: 18px;
            --radius-sm: 13px;
            --shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
            --grad-primary: linear-gradient(135deg, #F5B301, #FF8A00);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(ellipse at top, #14141F 0%, #0A0A0F 60%);
            color: var(--text);
            min-height: 100vh;
            padding: 16px 16px 110px;
        }

        .login-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            z-index: 9999;
            padding: 20px;
        }

        .login-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px 32px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .login-logo {
            width: 88px;
            height: 88px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--primary);
            box-shadow: 0 0 40px rgba(245, 179, 1, 0.4);
        }

        .login-logo img { width: 100%; height: 100%; object-fit: cover; }

        .login-container h1 {
            font-size: 26px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .login-sub { color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; }
        .login-form { display: flex; flex-direction: column; gap: 14px; }

        .login-input {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-2);
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            color: var(--text);
            font-size: 16px;
            text-align: center;
            letter-spacing: 2px;
            font-family: inherit;
        }

        .login-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(245, 179, 1, 0.15); }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--grad-primary);
            border: none;
            border-radius: 12px;
            color: #0A0A0F;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(245, 179, 1, 0.3);
        }

        .login-btn:active { transform: scale(0.98); }
        .login-error { color: var(--error); font-size: 13px; min-height: 20px; }

        .container { max-width: 1440px; margin: 0 auto; }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0 20px;
            border-bottom: 1px solid var(--border-soft);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left { display: flex; align-items: center; gap: 14px; }

        .header-logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            box-shadow: 0 0 20px rgba(245, 179, 1, 0.4);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 900;
            color: var(--primary);
        }

        .stats-wrapper {
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .stat-card {
            background: var(--bg-2);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-sm);
            padding: 14px 10px;
            text-align: center;
        }

        .stat-card:hover { border-color: var(--primary); }

        .stat-card .value {
            font-size: 18px;
            font-weight: 900;
            color: var(--primary-soft);
            font-family: 'Courier New', monospace;
            letter-spacing: -0.5px;
        }

        .stat-card .label {
            font-size: 9px;
            color: var(--text-secondary);
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-weight: 700;
        }

        .stat-card .label i { color: var(--primary); font-size: 9px; }

        .refresh-stats-btn {
            width: 100%;
            padding: 12px;
            background: var(--grad-primary);
            border: none;
            border-radius: 40px;
            color: #0A0A0F;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .refresh-stats-btn:active { transform: scale(0.98); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .panel-card {
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary);
        }

        .card-title i {
            color: var(--primary);
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(245, 179, 1, 0.12);
            border-radius: 8px;
            font-size: 13px;
        }

        .form-group { margin-bottom: 14px; }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-2);
            border: 1px solid var(--border-soft);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
        }

        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(245, 179, 1, 0.15); }
        .form-control::placeholder { color: var(--text-muted); }
        select.form-control { cursor: pointer; }
        textarea.form-control { resize: vertical; min-height: 90px; }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: inherit;
        }

        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--grad-primary); color: #0A0A0F; box-shadow: 0 4px 15px rgba(245, 179, 1, 0.25); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-danger { background: var(--error); color: #fff; }
        .btn-warning { background: var(--warning); color: #fff; }
        .btn-info { background: var(--info); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid var(--border-soft); color: var(--text-secondary); }
        .btn-outline:hover { border-color: var(--primary); color: var(--text); }
        .btn-sm { padding: 6px 14px; font-size: 11px; }
        .btn-icon { width: 34px; height: 34px; padding: 0; border-radius: 10px; }

        .filter-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 12px; }
        .filter-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .badge-active { background: rgba(34, 197, 94, 0.15); color: var(--success); }
        .badge-pending { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .badge-completed { background: rgba(59, 130, 246, 0.15); color: var(--info); }
        .badge-rejected { background: rgba(239, 68, 68, 0.15); color: var(--error); }
        .badge-gram { background: rgba(245, 179, 1, 0.15); color: var(--primary-soft); }
        .badge-admin { background: rgba(59, 130, 246, 0.15); color: var(--info); }
        .badge-user { background: rgba(107, 114, 128, 0.15); color: var(--text-secondary); }
        .badge-main { background: rgba(245, 179, 1, 0.15); color: var(--primary-soft); }
        .badge-community { background: rgba(168, 85, 247, 0.15); color: #C084FC; }
        .badge-partner { background: rgba(34, 197, 94, 0.15); color: var(--success); }
        .badge-blocked { background: rgba(239, 68, 68, 0.15); color: var(--error); }

        .user-card {
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            padding: 24px;
            margin-top: 16px;
        }

        .user-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .user-card-main { display: flex; align-items: center; gap: 14px; }

        .user-card-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
        }

        .user-card-name { font-size: 17px; font-weight: 800; color: var(--text); }
        .user-card-id { font-size: 12px; color: var(--text-muted); font-family: monospace; }

        .user-card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .user-card-item {
            background: var(--bg-2);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-sm);
            padding: 14px;
            text-align: center;
        }

        .user-card-item.full-width { grid-column: 1 / -1; }
        .user-card-item .label {
            display: block;
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .user-card-item .value {
            display: block;
            font-size: 15px;
            font-weight: 900;
            color: var(--primary-soft);
            font-family: 'Courier New', monospace;
        }

        .user-actions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            padding-top: 20px;
            border-top: 1px solid var(--border-soft);
        }

        .user-action-btn {
            padding: 12px 14px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: #fff;
            font-family: inherit;
        }

        .user-action-btn:active { transform: scale(0.96); }
        .user-action-btn i { font-size: 16px; }

        .action-add-mining { background: var(--grad-primary); color: #0A0A0F; }
        .action-deduct-mining { background: linear-gradient(135deg, #FF8A00, #C96A00); color: #fff; }
        .action-add-withdrawable { background: linear-gradient(135deg, #22C55E, #16A34A); }
        .action-deduct-withdrawable { background: linear-gradient(135deg, #16A34A, #0F7A33); }
        .action-ban { background: var(--error); }
        .action-unban { background: var(--success); }
        .action-delete { background: linear-gradient(135deg, #A855F7, #6D28D9); }
        .action-reset { background: var(--info); }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow);
        }

        .modal-title { font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
        .modal-subtitle { font-size: 13px; color: var(--text-secondary); margin-bottom: 18px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions .btn { flex: 1; }

        .list-card {
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
        }

        .list-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
        .list-card-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .list-card-name { font-size: 15px; font-weight: 800; color: var(--primary-soft); }
        .list-card-id { font-size: 10px; color: var(--text-muted); font-family: monospace; background: var(--bg-2); padding: 2px 8px; border-radius: 10px; }
        .list-card-body { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--text-secondary); }
        .list-card-body a { color: var(--primary); text-decoration: none; word-break: break-all; }
        .list-card-body .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .list-card-body .label { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px; font-weight: 700; }
        .list-card-actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }

        .progress-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
        .progress-bar { flex: 1; height: 5px; background: rgba(245, 179, 1, 0.1); border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--grad-primary); border-radius: 5px; }
        .progress-text { font-size: 11px; color: var(--text-secondary); font-family: 'Courier New', monospace; flex-shrink: 0; }

        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10001;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 420px;
            width: calc(100% - 32px);
            pointer-events: none;
        }

        .toast {
            background: var(--surface-2);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-sm);
            padding: 14px 20px;
            box-shadow: var(--shadow);
            font-size: 13px;
            font-weight: 600;
            max-width: 100%;
            word-wrap: break-word;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast::before {
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            font-size: 16px;
            flex-shrink: 0;
        }

        .toast.success { border-left: 4px solid var(--success); }
        .toast.success::before { content: '\f058'; color: var(--success); }
        .toast.error { border-left: 4px solid var(--error); }
        .toast.error::before { content: '\f057'; color: var(--error); }
        .toast.warning { border-left: 4px solid var(--warning); }
        .toast.warning::before { content: '\f071'; color: var(--warning); }
        .toast.info { border-left: 4px solid var(--info); }
        .toast.info::before { content: '\f05a'; color: var(--info); }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 40px; opacity: 0.3; margin-bottom: 12px; display: block; }
        .empty-state p { font-size: 13px; }

        .topusers-grid { display: flex; flex-direction: column; gap: 10px; }

        .topuser-item {
            display: grid;
            grid-template-columns: 50px 1fr 110px 50px;
            gap: 10px;
            padding: 12px 16px;
            background: var(--bg-2);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-soft);
            align-items: center;
        }

        .topuser-item .rank { font-weight: 900; color: var(--primary); font-size: 14px; }
        .topuser-item .user-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .topuser-item .user-info img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid var(--primary); flex-shrink: 0; }
        .topuser-item .user-info .name { font-weight: 700; font-size: 13px; }
        .topuser-item .user-info .id { font-size: 10px; color: var(--text-muted); font-family: monospace; }
        .topuser-item .value { text-align: right; font-weight: 900; color: var(--primary-soft); font-size: 13px; font-family: 'Courier New', monospace; }

        .preview-card {
            background: var(--bg-2);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-sm);
            overflow: hidden;
            margin-top: 10px;
        }

        .preview-photo { width: 100%; max-height: 200px; object-fit: cover; display: block; }
        .preview-body { padding: 14px 18px; font-size: 14px; color: var(--text-secondary); word-wrap: break-word; line-height: 1.5; }
        .preview-buttons { display: flex; flex-direction: column; gap: 6px; padding: 0 14px 14px; }
        .preview-btn { padding: 8px 12px; background: rgba(245, 179, 1, 0.12); border: 1px solid var(--primary); border-radius: 8px; text-align: center; font-size: 12px; color: var(--primary-soft); font-weight: 700; }

        .button-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: var(--bg-2);
            border: 1px solid var(--border-soft);
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 6px;
        }

        .button-list-item .btn-info { flex: 1; min-width: 0; }
        .button-list-item .btn-info .bname { font-size: 12px; font-weight: 800; color: var(--primary-soft); }
        .button-list-item .btn-info .burl { font-size: 10px; color: var(--text-muted); word-break: break-all; }
        .button-list-item .btn-actions { display: flex; gap: 4px; flex-shrink: 0; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 4px 12px;
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 6px 2px;
            border-radius: 12px;
            font-family: inherit;
        }

        .nav-item i { font-size: 18px; }
        .nav-item span { font-size: 9px; font-weight: 700; letter-spacing: 0.2px; }
        .nav-item.active { color: var(--primary); background: rgba(245, 179, 1, 0.1); }

        .flex { display: flex; align-items: center; gap: 8px; }
        .flex-wrap { flex-wrap: wrap; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .mt-8 { margin-top: 8px; }
        .mt-12 { margin-top: 12px; }
        .mt-16 { margin-top: 16px; }
        .mb-8 { margin-bottom: 8px; }
        .mb-12 { margin-bottom: 12px; }
        .text-muted { color: var(--text-muted); font-size: 12px; }
        .text-center { text-align: center; }

        @media (max-width: 700px) {
            body { padding: 12px 12px 110px; }
            .grid-2 { grid-template-columns: 1fr; }
            .header h1 { font-size: 16px; }
            .header-logo { width: 40px; height: 40px; }
            .stat-card .value { font-size: 15px; }
            .stat-card { padding: 10px 6px; }
            .stat-card .label { font-size: 8px; }
            .topuser-item { grid-template-columns: 30px 1fr 90px 40px; font-size: 12px; }
            .user-card-grid { grid-template-columns: 1fr 1fr; }
            .user-actions-grid { grid-template-columns: 1fr 1fr; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(245, 179, 1, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="login-screen" class="login-screen">
    <div class="login-container">
        <div class="login-logo">
            <img src="https://slho.shop/i/8281" alt="Logo">
        </div>
        <h1>Admin Panel</h1>
        <p class="login-sub">Enter password to access</p>
        <div class="login-form">
            <input type="password" id="login-password" class="login-input" placeholder="••••••••" onkeydown="if(event.key==='Enter') login()">
            <button class="login-btn" onclick="login()"><i class="fas fa-arrow-right"></i> Login</button>
            <div id="login-error" class="login-error"></div>
        </div>
    </div>
</div>

<div id="app" style="display:none;">
    <div class="container">
        <div class="header">
            <div class="header-left">
                <img src="https://slho.shop/i/8281" class="header-logo" alt="Logo">
                <h1>Admin Panel</h1>
            </div>
        </div>

<script>
const API_URL = window.location.origin + '/api';
let notifButtons = [];
let loginAttempts = 0;
let isLocked = false;

function vibrate(pattern) {
    if (navigator.vibrate) navigator.vibrate(pattern);
}

document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.nav-item').forEach(function(item) {
        item.addEventListener('click', function() {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            this.classList.add('active');
            const tabId = this.getAttribute('data-tab');
            document.getElementById('tab-' + tabId).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    });
});

function insertTag(tag) {
    const textarea = document.getElementById('notif-message');
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const text = textarea.value;
    const selectedText = text.substring(start, end);
    const tags = {
        'b': ['<b>', '</b>'],
        'i': ['<i>', '</i>'],
        'u': ['<u>', '</u>'],
        'code': ['<code>', '</code>'],
        'pre': ['<pre>', '</pre>'],
        'a': ['<a href="https://">', '</a>'],
        'br': ['<br>', '']
    };
    const tagPair = tags[tag];
    if (!tagPair) return;
    textarea.value = text.substring(0, start) + tagPair[0] + selectedText + tagPair[1] + text.substring(end);
    textarea.focus();
    updatePreview();
}

async function login() {
    if (isLocked) {
        document.getElementById('login-error').textContent = 'Too many failed attempts. Try again later.';
        return;
    }
    const input = document.getElementById('login-password');
    const error = document.getElementById('login-error');
    error.textContent = '';
    const result = await apiCall('/admin/login', { password: input.value });
    if (result && result.success) {
        loginAttempts = 0;
        vibrate([30, 30, 30]);
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        initApp();
    } else {
        loginAttempts++;
        vibrate([100, 50, 100]);
        error.textContent = 'Wrong password! (' + loginAttempts + '/5)';
        input.value = '';
        input.focus();
        if (loginAttempts >= 5) {
            isLocked = true;
            error.textContent = 'Locked for 5 minutes.';
            setTimeout(function() {
                isLocked = false;
                loginAttempts = 0;
                error.textContent = '';
            }, 300000);
        }
    }
}

function toast(message, type) {
    type = type || 'info';
    const container = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = message;
    container.appendChild(el);
    if (type === 'success') vibrate(30);
    else if (type === 'error') vibrate([100, 50, 100]);
    else if (type === 'warning') vibrate([50, 30, 50]);
    setTimeout(function() {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-30px)';
        setTimeout(function() { el.remove(); }, 300);
    }, 4500);
}

async function apiCall(endpoint, data) {
    data = data || {};
    try {
        const response = await fetch(API_URL + endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await response.json();
        if (!response.ok) {
            const errMsg = result.error || result.message || ('HTTP ' + response.status);
            console.error('❌ [API] ' + endpoint + ':', errMsg);
            toast(errMsg, 'error');
            return null;
        }
        if (result && result.success === false) {
            const errMsg = result.error || 'Operation failed';
            console.error('❌ [API] ' + endpoint + ':', errMsg);
            toast(errMsg, 'error');
            return result;
        }
        return result;
    } catch (e) {
        console.error('❌ [API] ' + endpoint + ' network error:', e.message);
        toast('Network error: ' + e.message, 'error');
        return null;
    }
}

function formatGram(num) {
    return (parseFloat(num) || 0).toFixed(4);
}

function formatGramFull(num) {
    return (parseFloat(num) || 0).toFixed(8);
}

function formatDate(ts) {
    if (!ts) return 'N/A';
    const d = new Date(ts);
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = d.getFullYear();
    return day + '/' + month + '/' + year;
}

function truncate(str, len) {
    if (!str) return 'User';
    return str.length > len ? str.substring(0, len) + '…' : str;
}

function escName(name) {
    return (name || 'User').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function initApp() {
    loadStats();
    setupEventListeners();
}

function setupEventListeners() {
    document.getElementById('user-search-btn').addEventListener('click', loadUsers);
    document.getElementById('user-search-input').addEventListener('keypress', e => { if (e.key === 'Enter') loadUsers(); });
    document.getElementById('task-search-btn').addEventListener('click', loadTasks);
    document.getElementById('task-create-btn').addEventListener('click', createTask);
    document.getElementById('withdrawal-search-btn').addEventListener('click', loadWithdrawals);
    document.getElementById('promo-generate-btn').addEventListener('click', generatePromo);
    document.getElementById('promo-create-btn').addEventListener('click', createPromo);
    document.getElementById('promo-search-btn').addEventListener('click', loadPromoCodes);
    document.getElementById('notif-target').addEventListener('change', toggleNotifUser);
    document.getElementById('notif-add-btn').addEventListener('click', addNotifButton);
    document.getElementById('notif-send-btn').addEventListener('click', sendNotification);
    document.getElementById('notif-message').addEventListener('input', updatePreview);
    document.getElementById('notif-photo').addEventListener('input', updatePreview);
    document.getElementById('topusers-btn').addEventListener('click', loadTopUsers);
}

async function loadStats() {
    const result = await apiCall('/admin/stats');
    if (result && result.success) {
        document.getElementById('stat-users').textContent = result.data.totalUsers || 0;
        document.getElementById('stat-mining').textContent = formatGram(result.data.totalMining || 0);
        document.getElementById('stat-withdrawable').textContent = formatGram(result.data.totalWithdrawable || 0);
        document.getElementById('stat-withdrawn').textContent = formatGram(result.data.totalWithdrawn || 0);
    }
}

async function loadUsers() {
    const query = document.getElementById('user-search-input').value.trim();
    const container = document.getElementById('user-result');
    if (!query) {
        container.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><p>Enter search query</p></div>';
        return;
    }
    container.innerHTML = '<div class="text-center mt-12"><span class="spinner"></span></div>';
    const result = await apiCall('/admin/users/search', { query: query });
    if (!result || !result.success) {
        container.innerHTML = '<div class="empty-state"><i class="fas fa-user-slash"></i><p>User not found</p></div>';
        return;
    }
    const users = result.data || [];
    if (users.length === 0) {
        container.innerHTML = '<div class="empty-state"><i class="fas fa-user-slash"></i><p>No users found</p></div>';
        return;
    }
    container.innerHTML = users.map(u => renderUserCard(u)).join('');
}

function renderUserCard(u) {
    const status = u.state === 'ban' ? 'Banned' : 'Active';
    const statusClass = u.state === 'ban' ? 'badge-rejected' : 'badge-active';
    const blockedBadge = u.bot_blocked ? '<span class="badge badge-blocked"><i class="fas fa-ban"></i> Bot Blocked</span>' : '';
    const joinDate = formatDate(u.created_at);
    const welcomeBadge = u.welcome_bonus_claimed ? '<span class="badge badge-active">✅ Claimed</span>' : '<span class="badge badge-pending">Not Claimed</span>';

    return `
        <div class="user-card">
            <div class="user-card-header">
                <div class="user-card-main">
                    <img src="${u.photo_url || 'https://slho.shop/i/8281'}" class="user-card-avatar" onerror="this.src='https://slho.shop/i/8281'">
                    <div>
                        <div class="user-card-name">${u.first_name || 'User'}</div>
                        <div class="user-card-id">ID: ${u.id}${u.username ? ' · @' + u.username : ''}</div>
                    </div>
                </div>
                <div class="flex flex-wrap">
                    <span class="badge ${statusClass}">${status}</span>
                    ${blockedBadge}
                </div>
            </div>
            <div class="user-card-grid">
                <div class="user-card-item"><span class="label">Mining Balance</span><span class="value">${formatGramFull(u.mining_balance || 0)}</span></div>
                <div class="user-card-item"><span class="label">Withdrawable</span><span class="value">${formatGramFull(u.withdrawable_balance || 0)}</span></div>
                <div class="user-card-item"><span class="label">Ref Earnings</span><span class="value">${formatGramFull(u.referral_gram_earnings || 0)}</span></div>
                <div class="user-card-item"><span class="label">Pending GRAM</span><span class="value">${formatGramFull(u.pending_gram_reward || 0)}</span></div>
                <div class="user-card-item"><span class="label">Total Referrals</span><span class="value">${u.total_referrals || 0}</span></div>
                <div class="user-card-item"><span class="label">Verified Refs</span><span class="value">${u.verified_referrals || 0}</span></div>
                <div class="user-card-item"><span class="label">Tasks Done</span><span class="value">${u.total_tasks_completed || 0}</span></div>
                <div class="user-card-item"><span class="label">Mining Starts</span><span class="value">${u.total_mining_starts || 0}</span></div>
                <div class="user-card-item full-width"><span class="label">Welcome Bonus</span><span class="value">${welcomeBadge}</span></div>
                <div class="user-card-item full-width"><span class="label">Joining Date</span><span class="value">${joinDate}</span></div>
            </div>
            <div class="user-actions-grid">
                <button class="user-action-btn action-add-mining" onclick="openBalanceModal(${u.id}, 'mining_balance', 'add', '${escName(u.first_name)}')">
                    <i class="fas fa-plus-circle"></i> Add Mining
                </button>
                <button class="user-action-btn action-deduct-mining" onclick="openBalanceModal(${u.id}, 'mining_balance', 'deduct', '${escName(u.first_name)}')">
                    <i class="fas fa-minus-circle"></i> Deduct Mining
                </button>
                <button class="user-action-btn action-add-withdrawable" onclick="openBalanceModal(${u.id}, 'withdrawable_balance', 'add', '${escName(u.first_name)}')">
                    <i class="fas fa-wallet"></i> Add Withdrawable
                </button>
                <button class="user-action-btn action-deduct-withdrawable" onclick="openBalanceModal(${u.id}, 'withdrawable_balance', 'deduct', '${escName(u.first_name)}')">

    const { userId, type, action } = balanceModalData;

let confirmCallback = null;

function showConfirm(title, message, callback, danger = true) {
    document.getElementById('confirm-title').innerHTML = '<i class="fas fa-exclamation-triangle"></i> ' + title;
    document.getElementById('confirm-message').textContent = message;
    confirmCallback = callback;
    const btn = document.getElementById('confirm-action-btn');
    btn.className = danger ? 'btn btn-danger' : 'btn btn-primary';
    document.getElementById('confirm-modal').classList.add('active');
}

function closeConfirmModal() {
    document.getElementById('confirm-modal').classList.remove('active');
    confirmCallback = null;
}

document.getElementById('confirm-action-btn')?.addEventListener('click', async function() {
    if (confirmCallback) {
        this.disabled = true;
        this.innerHTML = '<span class="spinner"></span>';
        await confirmCallback();
        this.disabled = false;
        this.innerHTML = 'Confirm';
    }
    closeConfirmModal();
});

async function loadTasks() {
    const taskId = document.getElementById('task-search-id').value.trim();
    const owner = document.getElementById('task-search-owner').value;
    const status = document.getElementById('task-search-status').value;
    const category = document.getElementById('task-search-category').value;
    const creator = document.getElementById('task-search-creator').value;

    const container = document.getElementById('tasks-container');
    container.innerHTML = '<div class="text-center mt-12"><span class="spinner"></span></div>';

    const result = await apiCall('/admin/tasks/list', {
        taskId: taskId || null,
        owner: owner ? parseInt(owner) : null,
        status: status || null,
        category: category || null,
        creator: creator || null
    });

    if (!result || !result.success) {

function renderTaskCard(t) {
    const statusClass = t.status === 'active' ? 'badge-active' :
        t.status === 'pending' ? 'badge-pending' :
        t.status === 'completed' ? 'badge-completed' : 'badge-rejected';
    const progress = t.total > 0 ? (t.total_completed / t.total * 100) : 0;
    const isAdminTask = t.owner === 0 || t.owner === null || t.owner === undefined;
    const catIcons = { main: 'fa-home', partner: 'fa-handshake', community: 'fa-users' };
    const catClasses = { main: 'badge-main', partner: 'badge-partner', community: 'badge-community' };
    const catIcon = catIcons[t.category] || 'fa-home';
    const catClass = catClasses[t.category] || 'badge-main';

    return `
        <div class="list-card">
            <div class="list-card-header">
                <div class="list-card-title">
                    <span class="list-card-name">${t.name}</span>
                    <span class="list-card-id">#${t.id}</span>
                    <span class="badge ${catClass}"><i class="fas ${catIcon}"></i> ${t.category || 'main'}</span>
                    ${isAdminTask ? '<span class="badge badge-admin">Admin</span>' : '<span class="badge badge-user">User</span>'}
                </div>
                <span class="badge ${statusClass}">${t.status}</span>
            </div>
            <div class="list-card-body">
                <div class="row"><span class="label">Owner:</span> <span>${isAdminTask ? 'Admin' : (t.owner || 'N/A')}</span></div>
                <div class="row"><span class="label">URL:</span> <a href="${t.url}" target="_blank">${t.url}</a></div>
                <div class="progress-row">
                    <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(progress, 100)}%"></div></div>
                    <span class="progress-text">${t.total_completed || 0}/${t.total}</span>
                </div>
            </div>
            <div class="list-card-actions">
                ${t.status === 'pending' ? `<button class="btn btn-success btn-sm" onclick="updateTaskStatus('${t.id}','active')"><i class="fas fa-check"></i> Approve</button>` : ''}
                ${t.status === 'pending' ? `<button class="btn btn-danger btn-sm" onclick="updateTaskStatus('${t.id}','rejected')"><i class="fas fa-times"></i> Reject</button>` : ''}
                <button class="btn btn-danger btn-sm" onclick="deleteTask('${t.id}')"><i class="fas fa-trash"></i> Delete</button>
            </div>
        </div>
    `;
}

        const explorerLink = w.tx_hash ? `<div class="row"><span class="label">TX:</span> <a href="https://tonscan.org/tx/${w.tx_hash}" target="_blank">View on explorer</a></div>` : '';

function addNotifButton() {
    const name = document.getElementById('notif-btn-name').value.trim();
    const url = document.getElementById('notif-btn-url').value.trim();
    if (!name || !url) { toast('Enter button name and URL', 'warning'); return; }
    notifButtons.push({ text: name, url: url });
    renderNotifButtons();
    document.getElementById('notif-btn-name').value = '';
    document.getElementById('notif-btn-url').value = '';
    updatePreview();
}

function renderNotifButtons() {
    document.getElementById('notif-buttons-list').innerHTML = notifButtons.map((btn, i) => `
        <div class="button-list-item">
            <div class="btn-info">
                <div class="bname">${btn.text}</div>
                <div class="burl">${btn.url}</div>
            </div>
            <div class="btn-actions">
                ${i > 0 ? `<button class="btn btn-outline btn-sm" onclick="moveNotifButton(${i}, -1)"><i class="fas fa-arrow-up"></i></button>` : ''}
                ${i < notifButtons.length - 1 ? `<button class="btn btn-outline btn-sm" onclick="moveNotifButton(${i}, 1)"><i class="fas fa-arrow-down"></i></button>` : ''}
                <button class="btn btn-danger btn-sm" onclick="removeNotifButton(${i})"><i class="fas fa-times"></i></button>
            </div>
        </div>
    `).join('');
    updatePreview();
}

function moveNotifButton(index, direction) {
    const newIndex = index + direction;
    if (newIndex < 0 || newIndex >= notifButtons.length) return;
    [notifButtons[index], notifButtons[newIndex]] = [notifButtons[newIndex], notifButtons[index]];
    renderNotifButtons();
}

function removeNotifButton(index) {
    notifButtons.splice(index, 1);
    renderNotifButtons();
}

async function sendNotification() {
    const target = document.getElementById('notif-target').value;
    const userId = target === 'single' ? parseInt(document.getElementById('notif-user-id').value) : null;
    const message = document.getElementById('notif-message').value.trim();
    const photoUrl = document.getElementById('notif-photo').value.trim() || null;

    if (!message) { toast('Enter message', 'warning'); return; }
    if (target === 'single' && !userId) { toast('Enter user ID', 'warning'); return; }

    const btn = document.getElementById('notif-send-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Sending...';

    const progressDiv = document.getElementById('notif-progress');
    const progressFill = document.getElementById('notif-progress-fill');
    const statusText = document.getElementById('notif-status-text');
    progressDiv.style.display = 'block';
    progressFill.style.width = '15%';
    statusText.textContent = 'Sending...';

    const progressInterval = setInterval(() => {
        const current = parseFloat(progressFill.style.width) || 0;
        if (current < 85) progressFill.style.width = (current + 5) + '%';
    }, 500);

    const result = await apiCall('/admin/notifications/send', {
        userId, message, buttons: notifButtons.length > 0 ? notifButtons : null, target, photoUrl
    });

    clearInterval(progressInterval);
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Broadcast';

    if (result && result.success) {
        progressFill.style.width = '100%';
        statusText.textContent = '✅ Sent: ' + result.sent + ' | Failed: ' + result.failed + ' | Blocked: ' + (result.blocked || 0) + ' | Total: ' + result.total;
        toast('Sent: ' + result.sent + ' | Failed: ' + result.failed, result.failed > 0 ? 'warning' : 'success');
        setTimeout(() => progressDiv.style.display = 'none', 4000);
    } else {
        progressDiv.style.display = 'none';
    }
}

    container.innerHTML = '<div class="topusers-grid">' + data.map((user, index) => {
        const rank = index + 1;
        const medal = rank <= 3 ? ['🥇', '🥈', '🥉'][rank - 1] : '#' + rank;
        return `
            <div class="topuser-item">
                <span class="rank">${medal}</span>
                <div class="user-info">
                    <img src="${user.photo_url || 'https://slho.shop/i/8281'}" onerror="this.src='https://slho.shop/i/8281'">
                    <div>
                        <div class="name">${truncate(user.first_name, 12)}</div>
                        <div class="id">ID: ${user.user_id}</div>
                    </div>
                </div>
                <div class="value">${formatGramFull(user.value)}</div>
                <button class="btn btn-danger btn-sm" onclick="deleteUser(${user.user_id})"><i class="fas fa-trash"></i></button>
            </div>
        `;
    }).join('') + '</div>';
}
</script>
</body>
</html>
